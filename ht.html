<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Left Side - Content & Form -->
        <div class="left-side">
            <div class="logo">Digital</div>

            <!-- Desktop Navigation -->
            <div class="nav">
                <a href="#" class="active">Home</a>
                <a href="#">About us</a>
                <a href="#">Blog</a>
                <a href="#">Pricing</a>
            </div>

            <h1 class="heading">
                Artificial Intelligence Driving<br>
                Results For The Travel Industry
            </h1>

            <p class="subtext">Welcome back! Please login to your account.</p>

            <form>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="hakeem@digital.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>

                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember Me</label>
                </div>

                <div class="buttons">
                    <button type="submit" class="btn btn-primary">Login</button>
                    <button type="button" class="btn btn-outline">Sign Up</button>
                </div>
            </form>
        </div>

        <!-- Right Side - Image -->
        <div class="right-side">
            <img src="/Users/ranjankumarprasai/Downloads/coding/2115107740b96ac6ff6a14bbb548a77c43d68d50.png" alt="Person on bicycle delivering message">
        </div>
    </div>
</body>
</html>
